services:
  rabbitmq:
    image: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
  mediaconverter:
    build:
      context: .
      target: dev
    image: kyokley/mediaconverter
    depends_on:
      - "rabbitmq"
    tty: true
    stdin_open: true
    environment:
      - BROKER=amqp://user:password@rabbitmq:5672/
      - MC_LOG_LEVEL=${MC_LOG_LEVEL:-INFO}
    command: bash -c "sleep 15 && celery -A main worker --concurrency=1 --loglevel=$${MC_LOG_LEVEL:-INFO}"
    volumes:
      - .:/code
